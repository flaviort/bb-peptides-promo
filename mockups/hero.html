<html lang="en" data-ground="ink">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'RBNo2.1';
  src: url('assets/rbno21a-medium-italic-latin.woff2') format('woff2');
  font-weight: 500; font-style: italic; font-display: swap;
}

:root {
  --electric: #3B60FF;
  --light: #89B5FC;
  --gray: #111111;
  --white: #FFFFFF;

  /* Midnight ground: Electric Blue pulled down to night, never pure black */
  --ground: #050A22;
  --ground-2: #0A1440;
  --pool: rgba(59, 96, 255, 0.55);
  --pool-core: rgba(137, 181, 252, 0.22);
  --hair: rgba(255, 255, 255, 0.14);
  --hair-strong: rgba(255, 255, 255, 0.3);
  --muted: rgba(226, 234, 255, 0.66);

  --display: 'RBNo2.1', 'Poppins', sans-serif;
  --body: 'Poppins', system-ui, sans-serif;
  --gutter: clamp(20px, 4vw, 56px);
}

:root[data-ground="ink"] {
  --ground: #111111;
  --ground-2: #161a2a;
  --pool: rgba(59, 96, 255, 0.42);
  --pool-core: rgba(137, 181, 252, 0.16);
  --muted: rgba(255, 255, 255, 0.62);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ground); color: var(--white); font-family: var(--body); -webkit-font-smoothing: antialiased; }
body { background: var(--ground); transition: background-color .6s ease; overflow-x: hidden; }
::selection { background: var(--electric); color: var(--white); }
:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ---------- Screen shell ---------- */
.screen {
  position: relative; height: 100svh; min-height: 640px; overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% 118%, var(--pool) 0%, rgba(59,96,255,0.12) 42%, transparent 70%),
    radial-gradient(60% 40% at 50% 100%, var(--pool-core) 0%, transparent 70%),
    linear-gradient(180deg, var(--ground) 0%, var(--ground) 45%, var(--ground-2) 100%);
  transition: background .6s ease;
}

/* Hairline grid, the brand book's structure, drawn faintly into the room */
.grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size: calc((100% - 2 * var(--gutter)) / 12) 25%;
  background-position: var(--gutter) 0;
  mask-image: radial-gradient(80% 70% at 50% 45%, #000 20%, transparent 80%);
}

/* ---------- Nav ---------- */
.nav {
  position: absolute; z-index: 20; inset: 0 0 auto 0; height: 96px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 var(--gutter);
}
.menu { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; justify-self: start; height: 48px; }
.menu i { display: grid; grid-template-columns: repeat(2, 5px); gap: 4px; }
.menu i b { width: 5px; height: 5px; background: var(--white); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.menu:hover i b:nth-child(1) { transform: translate(-2px,-2px); }
.menu:hover i b:nth-child(4) { transform: translate(2px,2px); }
.logo { display: block; width: clamp(150px, 15vw, 200px); }
.logo img { width: 100%; height: auto; display: block; }
.nav-right { justify-self: end; display: flex; align-items: center; gap: 24px; }
.nav-link { font-size: 14px; font-weight: 500; color: var(--muted); transition: color .2s; }
.nav-link:hover { color: var(--white); }

.btn {
  display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px;
  font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: background-color .25s, color .25s, border-color .25s;
}
.btn svg { width: 16px; height: 16px; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.btn:hover svg { transform: translateX(3px); }
.btn-primary { background: var(--white); color: var(--gray); }
.btn-primary:hover { background: var(--electric); color: var(--white); }
.btn-outline { border: 1px solid rgba(255,255,255,0.6); color: var(--white); }
.btn-outline:hover { background: var(--white); color: var(--gray); }

/* ---------- Frame ---------- */
.frame { position: absolute; inset: 120px var(--gutter) 40px; pointer-events: none; z-index: 5; }
.frame span { position: absolute; width: 14px; height: 14px; border-color: var(--hair-strong); border-style: solid; border-width: 0; }
.frame .tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.frame .tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame .bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.frame .br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
.tagline { position: absolute; top: 28px; left: 28px; font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 22ch; }
.count {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted);
}
.count .rule { width: 1px; height: 44px; background: var(--hair-strong); }
.count .now { color: var(--white); }

/* ---------- Stage ---------- */
.stage { position: absolute; inset: 0; z-index: 2; }
.beam {
  position: absolute; left: 50%; top: 0; width: min(46vw, 560px); height: 74%;
  transform: translateX(-50%);
  background: linear-gradient(180deg, rgba(137,181,252,0.34) 0%, rgba(59,96,255,0.16) 45%, transparent 100%);
  clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
  filter: blur(18px); mix-blend-mode: screen; pointer-events: none;
}
.lamp {
  position: absolute; left: 50%; top: 118px; transform: translateX(-50%);
  width: clamp(120px, 12vw, 170px); height: 6px; background: var(--light);
  box-shadow: 0 0 24px 6px rgba(137,181,252,0.55), 0 10px 60px 20px rgba(59,96,255,0.35);
}
.floor {
  position: absolute; left: 0; right: 0; top: 68%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(137,181,252,0.35) 30%, rgba(137,181,252,0.35) 70%, transparent);
}
.disc {
  position: absolute; left: 50%; top: 68%; width: min(40vw, 460px); height: 64px;
  transform: translate(-50%, -50%);
  background: radial-gradient(50% 50% at 50% 50%, rgba(137,181,252,0.55), rgba(59,96,255,0.25) 45%, transparent 72%);
  filter: blur(6px);
}

.carousel { position: absolute; z-index: 3; inset: 0; touch-action: pan-y; cursor: grab; }
.carousel.dragging { cursor: grabbing; }
.vial {
  position: absolute; left: 50%; top: 68%;
  width: var(--w); aspect-ratio: 320 / 640;
  transform-origin: 50% 100%;
  will-change: transform, filter, opacity;
  user-select: none; -webkit-user-drag: none;
}
.vial img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.vial .reflect {
  position: absolute; left: 0; top: 100%; width: 100%; height: 100%;
  transform: scaleY(-1); opacity: .22;
  mask-image: linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent 38%);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent 38%);
}
.vial.is-center { cursor: pointer; }

/* ---------- Title block ---------- */
.title {
  position: absolute; z-index: 10; left: 0; right: 0; bottom: clamp(70px, 10vh, 110px);
  display: flex; flex-direction: column; align-items: center; gap: 18px; pointer-events: none;
}
.name-row { display: flex; align-items: center; gap: clamp(16px, 3vw, 40px); pointer-events: auto; }
.name {
  font-family: var(--display); font-style: italic; font-weight: 500; text-transform: uppercase;
  font-size: clamp(2.6rem, 6.4vw, 6rem); line-height: .92; letter-spacing: -0.01em;
  min-width: 8ch; text-align: center; text-wrap: balance;
}
.name .clip { display: block; overflow: hidden; padding: 0 .08em; }
.name .inner { display: block; transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.name.out .inner { transform: translateY(-105%); opacity: 0; transition-duration: .28s; }
.name.in-start .inner { transform: translateY(105%); opacity: 0; transition: none; }
.arrow {
  width: 48px; height: 48px; flex: none; display: grid; place-items: center;
  border: 1px solid var(--hair-strong); transition: background-color .25s, border-color .25s, color .25s;
}
.arrow:hover { background: var(--white); color: var(--gray); border-color: var(--white); }
.arrow svg { width: 18px; height: 18px; }
.meta { font-size: 15px; color: var(--light); display: flex; gap: 14px; align-items: center; }
.meta .dot { width: 4px; height: 4px; background: var(--light); opacity: .6; }
.meta .strength { color: var(--muted); font-variant-numeric: tabular-nums; }

.track { display: flex; gap: 6px; pointer-events: auto; }
.track button { width: 22px; height: 18px; position: relative; }
.track button::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%);
  background: rgba(255,255,255,0.22); transition: background-color .3s, height .3s;
}
.track button:hover::before { background: rgba(255,255,255,0.6); }
.track button[aria-current="true"]::before { background: var(--electric); height: 4px; box-shadow: 0 0 12px rgba(59,96,255,.9); }

.scroll-hint {
  position: absolute; z-index: 10; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted);
}
.scroll-hint .line { width: 1px; height: 22px; background: var(--hair-strong); position: relative; overflow: hidden; }
.scroll-hint .line::after { content: ''; position: absolute; left: 0; top: -100%; width: 1px; height: 100%; background: var(--white); animation: drip 1.8s cubic-bezier(.6,0,.2,1) infinite; }
@keyframes drip { to { top: 100%; } }

/* ---------- Product screen (sample of the walk) ---------- */
.product .ghost {
  position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--display); font-style: italic; font-weight: 500; text-transform: uppercase;
  font-size: clamp(6rem, 19vw, 18rem); line-height: .86; letter-spacing: -0.02em; white-space: nowrap;
  color: transparent; -webkit-text-stroke: 1px rgba(137,181,252,0.16); text-align: center;
}
.product .hero-vial {
  position: absolute; z-index: 3; left: 50%; top: 52%; width: clamp(200px, 21vw, 300px);
  aspect-ratio: 320 / 640; transform: translate(-50%, -50%) rotate(-14deg);
  filter: drop-shadow(0 40px 60px rgba(0,0,0,.45));
}
.product .hero-vial img { width: 100%; height: 100%; object-fit: contain; }
.panel {
  position: absolute; z-index: 6; left: calc(var(--gutter) + 28px); top: 50%; transform: translateY(-50%);
  width: min(400px, 32vw); display: flex; flex-direction: column; gap: 22px;
}
.panel h2 {
  font-family: var(--display); font-style: italic; font-weight: 500; text-transform: uppercase;
  font-size: clamp(2.6rem, 4.6vw, 4.4rem); line-height: .92; letter-spacing: -0.01em; text-wrap: balance;
}
.panel .cat { font-size: 15px; color: var(--light); margin-top: -8px; }
.panel p { font-size: 16px; line-height: 1.625; color: rgba(236,241,255,.84); max-width: 42ch; }
.specs { border-top: 1px solid var(--hair); }
.specs div { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.specs dt { color: var(--muted); }
.specs dd { font-variant-numeric: tabular-nums; }
.focus { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
.focus li { height: 36px; display: inline-flex; align-items: center; gap: 10px; padding: 0 14px 0 12px; border: 1px solid var(--hair-strong); font-size: 13px; font-weight: 500; }
.focus li::before { content: ''; width: 6px; height: 6px; background: var(--electric); box-shadow: 0 0 8px rgba(59,96,255,.9); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

.rail {
  position: absolute; z-index: 6; right: calc(var(--gutter) + 28px); top: 50%; transform: translateY(-50%);
  list-style: none; display: flex; flex-direction: column; gap: 2px; text-align: right;
}
.rail button { font-size: 13px; color: rgba(255,255,255,.42); display: inline-flex; gap: 12px; align-items: center; justify-content: flex-end; height: 28px; transition: color .2s; }
.rail button span { font-variant-numeric: tabular-nums; font-size: 11px; width: 18px; }
.rail button::after { content: ''; width: 0; height: 1px; background: var(--electric); transition: width .35s cubic-bezier(.2,.8,.2,1); }
.rail button:hover { color: rgba(255,255,255,.8); }
.rail button:hover::after { width: 8px; }
.rail button[aria-current="true"] { color: var(--white); }
.rail button[aria-current="true"]::after { width: 20px; }

/* ---------- Review control (not part of the design) ---------- */
.review {
  position: fixed; z-index: 100; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 0;
  background: #fff; color: var(--gray); font-size: 12px; font-weight: 500; border: 1px solid #fff;
}
.review span { padding: 0 10px; }
.review button { height: 32px; padding: 0 12px; color: var(--gray); }
.review button[aria-pressed="true"] { background: var(--electric); color: #fff; }

@media (max-width: 860px) {
  .nav-link, .tagline, .rail { display: none; }
  .nav .btn { padding: 0 14px; }
  .frame { inset: 96px 16px 24px; }
  .count { right: -6px; }
  .arrow { display: none; }
  .meta { font-size: 13px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .product .hero-vial { top: 23%; width: 26vw; max-width: 150px; transform: translate(-50%, -50%) rotate(-10deg); }
  .product .ghost { top: 23%; }
  .panel .btn-outline { display: none; }
  .review { left: auto; right: 16px; bottom: auto; top: 84px; }
  .panel { left: 20px; right: 20px; width: auto; top: auto; bottom: 28px; transform: none; gap: 14px; }
  .panel p { font-size: 15px; }
  .specs div { grid-template-columns: 80px 1fr; padding: 9px 0; }
}
@media (max-width: 520px) {
  .nav { height: 72px; grid-template-columns: auto 1fr auto; }
  .menu span { display: none; }
  .logo { width: 132px; justify-self: center; }
  .nav .btn { height: 40px; font-size: 13px; }
  .nav .btn svg { display: none; }
  .frame { inset: 80px 16px 20px; }
  .vial, .floor, .disc { top: 62%; }
  .lamp { top: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
}
</style>
</head>

    strength: '5 mg/mL', vial: '5 mL vial',
    about: 'A naturally occurring peptide involved in supporting normal immune system function.',
    focus: ['Immune Function', 'Immune Health', 'Overall Resilience'] },
  { id: 'melanotan-ii', name: 'Melanotan II', ghost: 'MELANOTAN', cat: 'Recovery & Vitality', cs: 'recovery-and-vitality',
    strength: '2 mg / 1 mL', vial: '5 mL vial',
    about: 'A synthetic peptide that may support the skin’s natural tanning response by stimulating melanin production.',
    focus: ['Melanin Production', 'Even Skin Tone', 'Personalized Tanning'] },
  { id: 'semax-selank', name: 'Semax / Selank', ghost: 'SEMAX', cat: 'Neuro & Cognitive', cs: 'neuro-and-cognitive',
    strength: '1 mg / 1 mg per mL', vial: '5 mL vial',
    about: 'Semax and Selank in one physician-guided protocol for cognitive performance and focus.',
    focus: ['Cognitive Performance', 'Focus', 'Stress Management'] },
];
const N = P.length;
const pad = (n) => String(n).padStart(2, '0');
const wrap = (i) => ((i % N) + N) % N;

/* ---- Carousel ---- */
const car = document.getElementById('carousel');
const nodes = [];
const VISIBLE = 4; // vials each side
for (let k = -VISIBLE; k <= VISIBLE; k++) {
  const el = document.createElement('div');
  el.className = 'vial';
  el.innerHTML = '<img alt=""><img class="reflect" alt="">';
  car.appendChild(el);
  nodes.push({ el, k });
}

let pos = 0;          // continuous position (index)
let target = 0;
let active = 0;

function layout() {
  const vw = innerWidth;
  const mobile = vw < 600;
  const base = mobile ? Math.min(vw * 0.36, innerHeight * 0.26) : Math.min(vw * 0.17, 270, innerHeight * 0.3);
  const spacing = mobile ? vw * 0.36 : Math.max(vw * 0.17, base * 1.35);
  const frac = pos - Math.round(pos);
  const center = Math.round(pos);
  nodes.forEach(({ el, k }) => {
    const slot = k - frac;               // distance from center
    const idx = wrap(center + k);
    const p = P[idx];
    const imgs = el.querySelectorAll('img');
    const src = `assets/${p.id}.webp`;
    if (imgs[0].getAttribute('src') !== src) { imgs[0].src = src; imgs[1].src = src; }
    const a = Math.abs(slot);
    const x = slot * spacing * (1 - a * 0.045);
    const lift = a * a * base * 0.09;            // arc: outer vials ride up
    const scale = Math.max(0.42, 1 - a * 0.17);
    const rot = slot * 7;
    el.style.setProperty('--w', base + 'px');
    el.style.transform = `translate(-50%, -100%) translate(${x}px, ${-lift}px) rotate(${rot}deg) scale(${scale})`;
    el.style.filter = `brightness(${Math.max(0.32, 1 - a * 0.22)}) saturate(${Math.max(0.6, 1 - a * 0.1)}) blur(${Math.max(0, a - 1.4) * 1.4}px)`;
    el.style.opacity = a > VISIBLE - 0.5 ? Math.max(0, VISIBLE - a) * 2 : 1;
    el.style.zIndex = String(100 - Math.round(a * 10));
    el.classList.toggle('is-center', a < 0.5);
    el.querySelector('.reflect').style.display = a < 1.5 ? 'block' : 'none';
  });
}

function tick() {
  const d = target - pos;
  pos += d * 0.12;
  if (Math.abs(d) < 0.0005) pos = target;
  layout();
  const now = wrap(Math.round(pos));
  if (now !== active) { active = now; setActive(now); }
  requestAnimationFrame(tick);
}

/* ---- Title + track ---- */
const nameEl = document.getElementById('name');
const inner = document.getElementById('nameInner');
const track = document.getElementById('track');
P.forEach((p, i) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-label', p.name);
  b.addEventListener('click', () => go(i));
  track.appendChild(b);
});
let swapT;
function setActive(i) {
  const p = P[i];
  [...track.children].forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
  document.getElementById('countNow').textContent = pad(i + 1);
  document.getElementById('cat').textContent = p.cat;
  document.getElementById('strength').textContent = p.vial;
  nameEl.classList.add('out');
  clearTimeout(swapT);
  swapT = setTimeout(() => {
    inner.textContent = p.name;
    nameEl.classList.remove('out');
    nameEl.classList.add('in-start');
    void nameEl.offsetWidth;
    nameEl.classList.remove('in-start');
  }, 220);
  renderProduct(i);
}
function go(i) {
  // shortest path to index i
  const cur = Math.round(target);
  let d = wrap(i - wrap(cur));
  if (d > N / 2) d -= N;
  target = cur + d;
}
document.getElementById('prev').onclick = () => { target = Math.round(target) - 1; };
document.getElementById('next').onclick = () => { target = Math.round(target) + 1; };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') target = Math.round(target) - 1;
  if (e.key === 'ArrowRight') target = Math.round(target) + 1;
});

/* drag with momentum */
let dragX = null, startT = 0, vel = 0, lastX = 0, lastTime = 0;
car.addEventListener('pointerdown', (e) => {
  dragX = e.clientX; startT = target; lastX = e.clientX; lastTime = performance.now(); vel = 0;
  car.classList.add('dragging'); car.setPointerCapture(e.pointerId);
});
car.addEventListener('pointermove', (e) => {
  if (dragX === null) return;
  const spacing = Math.max(innerWidth * 0.17, 200);
  target = startT - (e.clientX - dragX) / spacing;
  pos = target;
  const t = performance.now();
  vel = (e.clientX - lastX) / Math.max(1, t - lastTime);
  lastX = e.clientX; lastTime = t;
});
const end = (e) => {
  if (dragX === null) return;
  const moved = Math.abs(e.clientX - dragX);
  dragX = null; car.classList.remove('dragging');
  target = Math.round(target - vel * 1.6);
  if (moved < 4) {
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find((n) => n.classList && n.classList.contains('vial'));
    if (hit && hit.classList.contains('is-center')) document.querySelector('.product').scrollIntoView({ behavior: 'smooth' });
  }
};
car.addEventListener('pointerup', end);
car.addEventListener('pointercancel', end);

/* ---- Product sample ---- */
const rail = document.getElementById('rail');
P.forEach((p, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<button><span>${pad(i + 1)}</span>${p.name}</button>`;
  li.querySelector('button').onclick = () => go(i);
  rail.appendChild(li);
});
function renderProduct(i) {
  const p = P[i];
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pCat').textContent = p.cat;
  document.getElementById('pAbout').textContent = p.about;
  document.getElementById('pStrength').textContent = p.strength;
  document.getElementById('pFormat').textContent = 'Injectable, ' + p.vial;
  document.getElementById('pImg').src = `assets/${p.id}.webp`;
  document.getElementById('ghost').textContent = p.ghost || p.name;
  document.getElementById('pLink').href = `${SITE}/${p.cs}/${p.slug || p.id}`;
  document.getElementById('pFocus').innerHTML = p.focus.map((f) => `<li>${f}</li>`).join('');
  [...rail.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
}

/* ---- Review toggle ---- */
document.querySelectorAll('.review button').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.dataset.ground = b.dataset.g;
  document.querySelectorAll('.review button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
}));

addEventListener('resize', layout);
setActive(0);
tick();
</script>
</body>
</html>
